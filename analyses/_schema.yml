analyses:
  - name: top_films_by_revenue
    description: Which films earn the most? Payments without a rental have no film and are left out.
    config:
      enabled: true
      docs:
        show: true
        node_color: purple
      tags: ['revenue', 'films']
    columns:
      - name: payments
        description: The total number of payments made for the film.
      - name: revenue
        description: The total revenue generated by the film.

  - name: revenue_by_store
    description: How much revenue does each store bring in? Payments without a rental have no store and are left out.
    config:
      enabled: true
      docs:
        show: true
        node_color: blue
      tags: ['revenue', 'store']
    columns:
      - name: payments
        description: The total number of payments made in the store.
      - name: revenue
        description: The total revenue generated by the store.

  - name: revenue_by_category
    description: Which film categories drive revenue, and what share of the total?
    config:
      enabled: true
      docs:
        show: true
        node_color: green
      tags: ['revenue', 'category']
    columns:
      - name: revenue
        description: The total revenue generated by the category.
      - name: share_pct
        description: The percentage share of the category's revenue compared to the total revenue.

  - name: monthly_revenue
    description: How does revenue develop month by month?
    config:
      enabled: true
      docs:
        show: true
        node_color: orange
      tags: ['revenue', 'monthly']
    columns:
      - name: month_name
        description: The month name for which the revenue is calculated.
      - name: revenue
        description: The total revenue generated in that month.

  - name: late_returns_by_store
    description: What share of returned rentals were kept longer than the film allows? Rentals not yet returned are left out.
    config:
      enabled: true
      docs:
        show: true
        node_color: red
      tags: ['returns', 'store']
    columns:
      - name: returned_rentals
        description: The number of returned rentals for the store.
      - name: late_returns
        description: The number of returned rentals kept longer than the film's rental duration.
      - name: late_pct
        description: The share of returned rentals that were late, in percent.

  - name: customer_value_segments
    description: How concentrated is revenue across customers? Customers are split into four equal groups by lifetime spend.
    config:
      enabled: true
      docs:
        show: true
        node_color: teal
      tags: ['revenue', 'customers']
    columns:
      - name: spend_quartile
        description: Spend group, 1 is the top quarter of customers by lifetime spend.
      - name: customers
        description: The number of customers in the group.
      - name: revenue
        description: The total revenue from the group's customers.
      - name: revenue_share_pct
        description: The group's share of total revenue, in percent.
      - name: avg_spend
        description: The average lifetime spend per customer in the group.
      - name: avg_rentals
        description: The average number of rentals per customer in the group.
      - name: avg_rental_days
        description: The average of each customer's average rental length in days.
