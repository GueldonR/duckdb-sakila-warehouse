models:
  - name: stg_customer
    description: One row per customer, cleaned from sakila.customer. Names and email are dropped here (data minimisation).
    columns:
      - name: customer_id
        description: Primary key from the source system.
        data_tests: [unique, not_null]
      - name: address_id
        description: Foreign key to stg_address.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_address')
                field: address_id
      - name: is_active
        description: True if the customer account is active.
      - name: updated_at
        description: Last update in the source system. Naive timestamp, source time zone unknown; treated as UTC.

  - name: stg_address
    description: One row per address, cleaned from sakila.address. Phone, address2 and postal_code are dropped here (data minimisation).
    columns:
      - name: address_id
        description: Primary key from the source system.
        data_tests: [unique, not_null]
      - name: city_id
        description: Foreign key to stg_city.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_city')
                field: city_id
      - name: address
        description: The street address name.
        data_tests: [not_null]
      - name: updated_at
        description: Last update in the source system. Naive timestamp, source time zone unknown; treated as UTC.

  - name: stg_city
    description: One row per city, cleaned from sakila.city.
    columns:
      - name: city_id
        description: Primary key from the source system.
        data_tests: [unique, not_null]
      - name: country_id
        description: Foreign key to stg_country.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_country')
                field: country_id
      - name: city
        description: The city name.
        data_tests: [not_null]
      - name: updated_at
        description: Last update in the source system. Naive timestamp, source time zone unknown; treated as UTC.

  - name: stg_country
    description: One row per country, cleaned from sakila.country.
    columns:
      - name: country_id
        description: Primary key from the source system.
        data_tests: [unique, not_null]
      - name: country
        description: The country name.
        data_tests: [not_null]
      - name: updated_at
        description: Last update in the source system. Naive timestamp, source time zone unknown; treated as UTC.
  
  - name: stg_store
    description: One row per store, cleaned from sakila.store. manager_staff_id is dropped here (data minimisation).
    columns:
      - name: store_id
        description: Primary key from the source system.
        data_tests: [unique, not_null]
      - name: address_id
        description: Foreign key to stg_address.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_address')
                field: address_id
      - name: updated_at
        description: Last update in the source system. Naive timestamp, source time zone unknown; assumed UTC.
  
  - name: stg_staff
    description: One row per staff member, cleaned from sakila.staff. Names, username, email, password, picture and address are dropped here (data minimisation).
    columns:
      - name: staff_id
        description: Primary key from the source system.
        data_tests: [unique, not_null]
      - name: store_id
        description: Foreign key to stg_store.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_store')
                field: store_id
      - name: is_active
        description: True if the staff member is active.
      - name: updated_at
        description: Last update in the source system. Naive timestamp, source time zone unknown; treated as UTC.

  - name: stg_film
    description: One row per film, cleaned from sakila.film. Description is dropped here (data minimisation).
    columns:
      - name: film_id
        description: Primary key from the source system.
        data_tests: [unique, not_null]
      - name: language_id
        description: Foreign key to stg_language.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_language')
                field: language_id
      - name: rental_duration
        description: The number of days the film can be rented for.
      - name: rental_rate
        description: The rental rate for the film.
      - name: length
        description: The length of the film in minutes.
      - name: replacement_cost
        description: The cost to replace the film.
      - name: updated_at
        description: Last update in the source system. Naive timestamp, source time zone unknown; treated as UTC.

  - name: stg_language
    description: One row per language, cleaned from sakila.language.
    columns:
        - name: language_id
          description: Primary key from the source system.
          data_tests: [unique, not_null]
        - name: name
          description: The language name.
          data_tests: [not_null]
        - name: updated_at
          description: Last update in the source system. Naive timestamp, source time zone unknown; treated as UTC.

  - name: stg_category
    description: One row per film category, cleaned from sakila.category.
    columns:
      - name: category_id
        description: Primary key from the source system.
        data_tests: [unique, not_null]
      - name: name
        description: The category name.
        data_tests: [not_null]
      - name: updated_at
        description: Last update in the source system. Naive timestamp, source time zone unknown; treated as UTC.

  - name: stg_film_category
    description: One row per film and category pair, cleaned from sakila.film_category. In the data every film has exactly one category.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [film_id, category_id]
    columns:
      - name: film_id
        description: Foreign key to stg_film.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_film')
                field: film_id
      - name: category_id
        description: Foreign key to stg_category.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_category')
                field: category_id
      - name: updated_at
        description: Last update in the source system. Naive timestamp, source time zone unknown; treated as UTC.

  - name: stg_inventory
    description: One row per physical copy of a film in a store, cleaned from sakila.inventory.
    columns:
      - name: inventory_id
        description: Primary key from the source system.
        data_tests: [unique, not_null]
      - name: film_id
        description: Foreign key to stg_film.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_film')
                field: film_id
      - name: store_id
        description: Foreign key to stg_store. The store that holds the copy.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_store')
                field: store_id
      - name: updated_at
        description: Last update in the source system. Naive timestamp, source time zone unknown; treated as UTC.

  - name: stg_rental
    description: One row per rental, cleaned from sakila.rental.
    columns:
      - name: rental_id
        description: Primary key from the source system.
        data_tests: [unique, not_null]
      - name: inventory_id
        description: Foreign key to stg_inventory.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_inventory')
                field: inventory_id
      - name: customer_id
        description: Foreign key to stg_customer.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customer')
                field: customer_id
                
      - name: staff_id
        description: Foreign key to stg_staff. The staff member who handled the rental.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_staff')
                field: staff_id
      - name: rental_date
        description: When the film was rented. Naive timestamp, source time zone unknown; treated as UTC.
        data_tests: [not_null]
      - name: return_date
        description: When the film was returned. Null if not yet returned. Naive timestamp, source time zone unknown; treated as UTC.
      - name: updated_at
        description: Last update in the source system. Naive timestamp, source time zone unknown; treated as UTC.
