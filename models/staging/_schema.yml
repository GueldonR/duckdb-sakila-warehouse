models:
  - name: stg_customer
    description: One row per customer, cleaned from sakila.customer. Names and email are dropped here (data minimisation).
    columns:
      - name: customer_id
        description: Primary key from the source system.
        data_tests: [unique, not_null]
      - name: address_id
        description: Foreign key to stg_address.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_address')
                field: address_id
      - name: is_active
        description: True if the customer account is active.
      - name: updated_at
        description: Last update in the source system. Naive timestamp, source time zone unknown; treated as UTC.

  - name: stg_address
    description: One row per address, cleaned from sakila.address. Phone and address2 are dropped here (data minimisation).
    columns:
      - name: address_id
        description: Primary key from the source system.
        data_tests: [unique, not_null]
      - name: city_id
        description: Foreign key to stg_city.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_city')
                field: city_id
      - name: address
        description: The street address name.
        data_tests: [not_null]
      - name: updated_at
        description: Last update in the source system. Naive timestamp, source time zone unknown; treated as UTC.

  - name: stg_city
    description: One row per city, cleaned from sakila.city.
    columns:
      - name: city_id
        description: Primary key from the source system.
        data_tests: [unique, not_null]
      - name: country_id
        description: Foreign key to stg_country.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_country')
                field: country_id
      - name: city
        description: The city name.
        data_tests: [not_null]
      - name: updated_at
        description: Last update in the source system. Naive timestamp, source time zone unknown; treated as UTC.

  - name: stg_country
    description: One row per country, cleaned from sakila.country.
    columns:
      - name: country_id
        description: Primary key from the source system.
        data_tests: [unique, not_null]
      - name: country
        description: The country name.
        data_tests: [not_null]
      - name: updated_at
        description: Last update in the source system. Naive timestamp, source time zone unknown; treated as UTC.
  
  - name: stg_store
    description: One row per store, cleaned from sakila.store. manager_staff_id is dropped here (data minimisation).
    columns:
      - name: store_id
        description: Primary key from the source system.
        data_tests: [unique, not_null]
      - name: address_id
        description: Foreign key to stg_address.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_address')
                field: address_id
      - name: updated_at
        description: Last update in the source system. Naive timestamp, source time zone unknown; assumed UTC.
  
  - name: stg_staff
    description: One row per staff member, cleaned from sakila.staff. Names, username, email, password, picture and address are dropped here (data minimisation).
    columns:
      - name: staff_id
        description: Primary key from the source system.
        data_tests: [unique, not_null]
      - name: store_id
        description: Foreign key to stg_store.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_store')
                field: store_id
      - name: is_active
        description: True if the staff member is active.
      - name: updated_at
        description: Last update in the source system. Naive timestamp, source time zone unknown; treated as UTC.

  - name: stg_film
    description: One row per film, cleaned from sakila.film. Description is dropped here (data minimisation).
    columns:
      - name: film_id
        description: Primary key from the source system.
        data_tests: [unique, not_null]
      - name: language_id
        description: Foreign key to stg_language.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_language')
                field: language_id
      - name: rental_duration
        description: The number of days the film can be rented for.
      - name: rental_rate
        description: The rental rate for the film.
      - name: length
        description: The length of the film in minutes.
      - name: replacement_cost
        description: The cost to replace the film.
      - name: updated_at
        description: Last update in the source system. Naive timestamp, source time zone unknown; treated as UTC.

  - name: stg_language
    description: One row per language, cleaned from sakila.language.
    columns:
        - name: language_id
          description: Primary key from the source system.
          data_tests: [unique, not_null]
        - name: name
          description: The language name.
          data_tests: [not_null]
        - name: updated_at
          description: Last update in the source system. Naive timestamp, source time zone unknown; treated as UTC.
