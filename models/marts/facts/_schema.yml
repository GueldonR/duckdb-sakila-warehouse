models:
  - name: fact_rental_transaction
    description: One row per rental. Foreign keys to the dimensions plus the rental duration. Rentals not yet returned have no return date.
    columns:
      - name: rental_id
        description: Degenerate key, identifies the rental (source ID).
        data_type: integer
        data_tests: [unique, not_null]
      - name: customer_sk
        description: Foreign key to dim_customer.
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_sk
      - name: film_sk
        description: Foreign key to dim_film, via the rented inventory copy.
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_film')
                field: film_sk
      - name: store_sk
        description: Foreign key to dim_store, the store holding the inventory copy.
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_sk
      - name: staff_sk
        description: Foreign key to dim_staff, the staff member who handled the rental.
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_staff')
                field: staff_sk
      - name: rental_date_sk
        description: Foreign key to dim_time, the date the film was rented.
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_time')
                field: date_sk
      - name: return_date_sk
        description: Foreign key to dim_time, the date the film was returned. -1 (dim_time's "No date" row) for the 183 rentals not yet returned.
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_time')
                field: date_sk
      - name: rental_days
        description: Whole days between rental and return. Null if not returned.
        data_type: bigint
      - name: dbt_loaded_at
        description: Timestamp when dbt loaded the row. This is a dbt-managed column, not part of the source data.
        data_type: timestamp with time zone
        data_tests:
          - not_null

  - name: fact_payment_transaction
    description: One row per payment. Foreign keys to the dimensions plus the payment amount. Film and store come from the linked rental, so they point to the Unknown default rows for payments without one.
    columns:
      - name: payment_id
        description: Degenerate key, identifies the payment (source ID).
        data_type: integer
        data_tests: [unique, not_null]
      - name: rental_id
        description: Degenerate key, the rental the payment belongs to. Null for 5 payments in the source data.
        data_type: integer
        data_tests:
          - relationships:
              arguments:
                to: ref('fact_rental_transaction')
                field: rental_id
      - name: customer_sk
        description: Foreign key to dim_customer.
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_sk
      - name: staff_sk
        description: Foreign key to dim_staff, the staff member who took the payment.
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_staff')
                field: staff_sk
      - name: film_sk
        description: Foreign key to dim_film, via the linked rental. -1 (dim_film's "Unknown" row) for the 5 payments without a rental.
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_film')
                field: film_sk
      - name: store_sk
        description: Foreign key to dim_store, the store holding the rented inventory copy. -1 (dim_store's "Unknown" row) for the 5 payments without a rental.
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_sk
      - name: payment_date_sk
        description: Foreign key to dim_time, the date of the payment.
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_time')
                field: date_sk
      - name: amount
        description: Payment amount. Additive.
        data_type: decimal(5,2)
        data_tests:
          - not_null
      - name: dbt_loaded_at
        description: Timestamp when dbt loaded the row. This is a dbt-managed column, not part of the source data.
        data_type: timestamp with time zone
        data_tests:
          - not_null