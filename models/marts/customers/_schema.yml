models:
  - name: dim_customer
    description: One row per customer. Location at district/city/country level; names are dropped in staging, street address and postal code are not carried into the marts.
    columns:
      - name: customer_sk
        description: Surrogate key, md5 of customer_id.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Primary key for the customer dimension.
        data_tests:
          - unique
          - not_null
      - name: customer_store_id
        description: Home store of the customer (source ID).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_store')
                field: store_id
      - name: customer_city
        description: City of the customer's address.
        data_tests:
          - not_null
      - name: customer_country
        description: Country of the customer's address.
        data_tests:
          - not_null
