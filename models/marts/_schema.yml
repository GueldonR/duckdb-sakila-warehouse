version: 2

models:
  - name: dim_customer
    description: One row per customer. Location at district/city/country level; names are dropped in staging, street address and postal code are not carried into the marts.
    columns:
      - name: customer_sk
        description: Surrogate key, md5 of customer_id.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Primary key for the customer dimension.
        data_tests:
          - unique
          - not_null
      - name: customer_store_id
        description: Home store of the customer (source ID).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_store')
                field: store_id
      - name: customer_city
        description: City of the customer's address.
        data_tests:
          - not_null
      - name: customer_country
        description: Country of the customer's address.
        data_tests:
          - not_null

  - name: dim_staff
    description: One row per staff member. No personal data. 
    columns:
      - name: staff_sk
        description: Surrogate key, md5 of staff_id.
        data_tests: [unique, not_null]
      - name: staff_id
        description: Natural key from the source system.
        data_tests: [unique, not_null]
      - name: staff_store_id
        description: Store the staff member is assigned to (source ID).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_store')
                field: store_id

  - name: dim_store
    description: One row per store. Store address is business data, not personal data, so it is kept to identify stores by location.
    columns:
      - name: store_sk
        description: Surrogate key, md5 of store_id.
        data_tests: [unique, not_null]
      - name: store_id
        description: Natural key from the source system.
        data_tests: [unique, not_null]
      - name: store_city
        description: City of the store's address.
        data_tests: [not_null]
      - name: store_country
        description: Country of the store's address.
        data_tests: [not_null]

  - name: dim_film
    description: One row per film. 
    columns:
      - name: film_sk
        description: Surrogate key, md5 of film_id.
        data_tests: [unique, not_null]
      - name: film_id
        description: Natural key from the source system.
        data_tests: [unique, not_null]

  - name: dim_time
    description: One row per calendar day. Date attributes for grouping and filtering facts by date.
    columns:
      - name: date_sk
        description: Key for the date, an integer of the form YYYYMMDD.
        data_tests: [unique, not_null]
      - name: full_date
        description: The calendar date. Natural key.
        data_tests: [unique, not_null]
      - name: month_key
        description: Year and month as YYYYMM, for grouping months across years.
      - name: iso_day_of_week
        description: Day of the week, Monday is 1 and Sunday is 7.
      - name: is_weekend
        description: True for Saturday and Sunday.
