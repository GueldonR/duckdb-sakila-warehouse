version: 2

models:
  - name: dim_customer
    description: One row per customer, with location information
    columns:
      - name: customer_sk
        description: Surrogate key for the customer dimension. Generated by md5 through dbt_utils.generate_surrogate_key(['customer.customer_id']).
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Primary key for the customer dimension.
        data_tests:
          - unique
          - not_null
      - name: store_id
        description: The store to which the customer belongs.
        data_tests:
          - not_null
          # - relationships:
          #     arguments:
          #       to: ref('stg_store')
          #       field: store_id
      - name: customer_city
        data_tests:
          - not_null
      - name: customer_country
        data_tests:
          - not_null